<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator & Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Compound Interest Calculator</h1>

    <div class="grid">
        <div class="input-group">
            <label for="principal">Starting Amount ($)</label>
            <input type="number" id="principal" value="10000" min="0" max="1000000" step="100">
        </div>
        <div class="input-group">
            <label for="rate">Annual Interest Rate (%)</label>
            <input type="number" id="rate" value="7" min="0" max="30" step="0.1">
        </div>
        <div class="input-group">
            <label for="years">Time Horizon (Years)</label>
            <input type="number" id="years" value="10" min="1" max="50" step="1">
        </div>
    </div>

    <div class="result" id="finalBalance">Future Value: $19,671.51</div>

    <div class="chart-container">
        <canvas id="interestChart"></canvas>
    </div>
</div>

<script>
    const principalInput = document.getElementById('principal');
    const rateInput = document.getElementById('rate');
    const yearsInput = document.getElementById('years');
    const finalBalanceText = document.getElementById('finalBalance');
    const ctx = document.getElementById('interestChart').getContext('2d');

    const LIMITS = {
        principal: { min: 0, max: 1000000 },
        rate:      { min: 0, max: 30 },
        years:     { min: 1, max: 50 }
    };

    const clamp = (value, { min, max }) => Math.min(Math.max(value, min), max);

    const compact = new Intl.NumberFormat('en-US', {
        notation: 'compact',
        maximumFractionDigits: 1
    });

    let interestChart;

    function calculateCompoundInterest() {
        const P = clamp(parseFloat(principalInput.value) || 0, LIMITS.principal);
        const r = clamp(parseFloat(rateInput.value) || 0, LIMITS.rate) / 100;
        const t = Math.floor(clamp(parseInt(yearsInput.value) || 0, LIMITS.years));

        const labels = [];
        const data = [];

        for (let i = 0; i <= t; i++) {
            labels.push(`Year ${i}`);
            data.push(Math.round(P * Math.pow(1 + r, i) * 100) / 100);
        }

        const finalAmount = data[data.length - 1] || 0;
        finalBalanceText.textContent = `Future Value: $${finalAmount.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        })}`;

        if (interestChart) {
            interestChart.data.labels = labels;
            interestChart.data.datasets[0].data = data;
            interestChart.update();
        } else {
            interestChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Balance Over Time',
                            data: data,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.1,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#2874a6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: value => '$' + compact.format(value)
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: context => 'Balance: $' + context.parsed.y.toLocaleString()
                            }
                        }
                    }
                }
            });
        }
    }

    // Live updates while typing
    [principalInput, rateInput, yearsInput].forEach(input => {
        input.addEventListener('input', calculateCompoundInterest);
    });

    // Snap values back into range when the user finishes editing
    [
        [principalInput, LIMITS.principal],
        [rateInput, LIMITS.rate],
        [yearsInput, LIMITS.years]
    ].forEach(([input, limits]) => {
        input.addEventListener('change', () => {
            input.value = clamp(parseFloat(input.value) || limits.min, limits);
            calculateCompoundInterest();
        });
    });

    calculateCompoundInterest();
</script>

</body>
</html>
